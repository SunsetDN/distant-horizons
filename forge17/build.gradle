plugins {
    id 'com.gtnewhorizons.gtnhconvention'
    id 'xyz.wagyourtail.manifold'
}

manifold {
    version = rootProject.manifold_version
}

// GitVersionModule normally sets project.ext.modVersion, but we disabled it (see
// versionProperties/1.7.10.properties) so the modern root 'root' plugin owns versioning.
// RFG's injectTags reads modVersion via gradleTokenVersion=VERSION, so set it explicitly.
project.ext.modVersion = rootProject.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    testing {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

minecraft {
    javaCompatibilityVersion = 21
    mainLwjglVersion = 3
    lwjgl3Version = "3.4.0"

    // Useful when debugging the legacy classpath later.
    // extraRunJvmArguments.add("-Dorg.lwjgl.util.Debug=true")
    // extraRunJvmArguments.addAll("-Dlegacy.debugClassLoading=true", "-Dlegacy.debugClassLoadingFiner=false", "-Dlegacy.debugClassLoadingSave=true")
}

repositories {
    mavenLocal()
    maven {
        name = "mavenpattern"
        url = "https://mvn.falsepattern.com/releases"
        content {
            includeGroup "com.falsepattern"
        }
    }
}

dependencies {
    // Manifold preprocessor for shared :common sources (//#if MC_VER ...)
    annotationProcessor(manifold.module("preprocessor"))

    // Shared MC-independent subprojects: bundle their classes into the forge17 jar.
    shadowImplementation project(":api")
    shadowImplementation project(":core")
    // :common is consumed as source (see source/processResources blocks below)
    // because its Java references MC types that only exist on forge17's RFG classpath.

    api "com.github.GTNewHorizons:lwjgl3ify:3.0.10:dev"
    api "com.github.GTNewHorizons:Hodgepodge:2.7.13:dev"
    runtimeOnlyNonPublishable "com.github.GTNewHorizons:NotEnoughItems:2.7.4-GTNH:dev"
    shadowImplementation "com.electronwill.night-config:toml:3.6.6"
    shadowImplementation "com.electronwill.night-config:json:3.6.6"
    shadowImplementation "org.lz4:lz4-java:1.8.0"
    shadowImplementation "org.tukaani:xz:1.9"
    shadowImplementation "org.xerial:sqlite-jdbc:3.47.2.0"
    shadowImplementation "com.github.luben:zstd-jni:1.5.7-4"
    implementation "org.jetbrains:annotations:26.0.2"
    api "com.github.GTNewHorizons:GTNHLib:0.6.11:dev"
    compileOnly "com.github.GTNewHorizons:GT5-Unofficial:5.09.51.469:dev"
    compileOnly "com.github.GTNewHorizons:Angelica:2.1.5:dev"
    compileOnly "com.falsepattern:rple-mc1.7.10:2.1.0:api"
}

// Source-include :common ONLY in the main compileJava: it has Manifold's preprocessor
// plugin active, so //#if / #if MC_VER directives in :common's sources are evaluated.
// RFG's compileInjectedInterfacesJava handles only auto-generated interface stubs and
// must not see :common's preprocessor-laden sources. Read via fileTree so :common
// itself needs no plugin.
def commonDir = project(":common").projectDir
tasks.named('compileJava').configure {
    source(fileTree("$commonDir/src/main/java") { include "**/*.java" })
}
processResources {
    from "$commonDir/src/main/resources"
}

// RFG's compileInjectedInterfacesJava inherits compilerArgs from compileJava, so it
// picks up -Xplugin:Manifold even though the Manifold compiler jar isn't on its
// processor classpath. Strip the flag for that task only.
tasks.matching { it.name == 'compileInjectedInterfacesJava' }.configureEach {
    doFirst {
        options.compilerArgs.removeAll { it.toString().contains('-Xplugin:Manifold') }
    }
}

[
    "jar",
    "shadowJar",
    "sourcesJar",
].each { taskName ->
    tasks.named(taskName).configure {
        manifest {
            attributes("Lwjgl3ify-Aware": true)
        }
    }
}

[
    "runClient",
    "runServer",
    "runClient17",
    "runServer17",
].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        enabled = false
    }
}

plugins.withId("com.diffplug.spotless") {
    spotless {
        java {
            targetExclude(
                "src/*/java/com/seibel/distanthorizons/core/**",
                "src/*/java/com/seibel/distanthorizons/api/**",
                "src/*/java/com/seibel/distanthorizons/coreapi/**",
                "src/*/java/com/seibel/distanthorizons/common/render/**",
            )
        }
    }
}

tasks.withType(org.gradle.api.plugins.quality.Checkstyle).configureEach {
    exclude(
        "**/com/seibel/distanthorizons/core/**",
        "**/com/seibel/distanthorizons/api/**",
        "**/com/seibel/distanthorizons/coreapi/**",
        "**/com/seibel/distanthorizons/common/render/**",
    )
}
