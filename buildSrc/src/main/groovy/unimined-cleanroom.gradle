plugins {
    id 'dh-loader'
}

unimined.minecraft {
    minecraftForge {
        loader "14.23.5.2859"
        useToolchains = false
        accessTransformer project(":common").file("src/main/resources/${gradle.ext.accessWidenerVersion}.distanthorizons_at.cfg")
        mixinConfig("DistantHorizons.cleanroom.mixins.json")
    }
}

