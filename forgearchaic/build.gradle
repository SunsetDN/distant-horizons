plugins {
    id 'unimined-forgearchaic'
}

repositories {
    maven {
        name "GTNH Maven"
        url "https://nexus.gtnewhorizons.com/repository/public/" // UniMixins
    }
    maven {
        name = "mavenpattern"
        url = "https://mvn.falsepattern.com/releases" // RPLE
        content {
            includeGroup "com.falsepattern"
        }
    }
}

// ==================== Mod Dependency Helper ====================

def addMod(path, enabled) {
    if (enabled == "2")
        dependencies { modImplementation(path) }
    else if (enabled == "1")
        dependencies { modCompileOnly(path) }
}


// ==================== Dependencies ====================

dependencies {
    api "com.github.GTNewHorizons:lwjgl3ify:3.0.10:dev"
    api "com.github.GTNewHorizons:Hodgepodge:2.7.13:dev"
    implementation "org.jetbrains:annotations:26.0.2"
    api "com.github.GTNewHorizons:GTNHLib:0.6.11:dev"
    compileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.51.469:dev") { transitive = false }
    compileOnly "com.github.GTNewHorizons:Angelica:2.1.5:dev"
    compileOnly "com.falsepattern:rple-mc1.7.10:2.1.0:api"
    implementation "io.github.legacymoddingmc:unimixins:0.1.23:dev"
}

configurations.compileClasspath {
    exclude group: 'org.lwjgl', module: 'lwjgl'
}

// ==================== Tasks ====================

task deleteResources(type: Delete) {
    delete file("build/resources/main")
}

processResources {
    dependsOn(copyCoreResources)
    dependsOn(convertJsonToLang)
    // dependsOn(copyCommonLoaderResources)

    from(project(":common").file("src/main/resources/${gradle.ext.accessWidenerVersion}.distanthorizons_at.cfg")) {
        into 'META-INF'
    }
}

tasks.named('runClient') {
    dependsOn(copyCoreResources)
    // dependsOn(copyCommonLoaderResources)
    finalizedBy(deleteResources)
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}


