# 1.21.1 version
java_version=21
minecraft_version=1.21.1
parchment_version=1.20.6:2024.05.01
compatible_minecraft_versions=["1.21", "1.21.1"]
accessWidenerVersion=1_20_6
# Trimmed to neoforge only for DNCity (see settings.gradle.kts's includeBuild("mods/distant-horizons")):
# the fabric loader here needs fabric-loom 1.10-SNAPSHOT, which requires Gradle 8.12+, but this
# repo's composite build runs everything under its own root Gradle 8.11 (NeoForge moddev plugin
# pin) -- confirmed by hand: configuring :distant-horizons:fabric failed with exactly that Gradle
# version error. DNCity never uses fabric anyway (NeoForge-only mod), so the loader is dropped
# instead of bumping the whole repo's Gradle version. Same "strip to one loader" pattern as
# mods/Automobility's own fork (see settings.gradle.kts's comment on that includeBuild).
builds_for=neoforge
# forge is broken due to gradle/build script issues

# Netty
netty_version=4.1.97.Final

# Fabric loader
fabric_loader_version=0.16.9
fabric_api_version=0.115.0+1.21.1
    # Fabric mod versions
    modmenu_version=11.0.0-beta.1
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=mc1.21.1-0.6.2-fabric
    iris_version=1.8.1+1.21.1-fabric
    bclib_version=
    immersive_portals_version=
    canvas_version=

    # iris - needs 1.7.4+ to support the DH API
    fabric_incompatibility_list={ "iris": "<=1.7.4" }
    fabric_recommend_list={}
    
    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=1
    enable_lithium=0
    enable_iris=1
    enable_bclib=0
    enable_immersive_portals=0
    enable_canvas=0

# NeoForge loader
forge_version=
neoforge_version=21.1.216
    neoforge_version_range=[*,)
    
    # NeoForge mod versions
    neo_iris_version=1.8.12+1.21.1-neoforge

    # (Neo)Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    neo_enable_iris=1

