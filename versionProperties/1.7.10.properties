# 1.7.10 version
java_version=21
minecraft_version=1.7.10
parchment_version=
compatible_minecraft_versions=["1.7.10"]
accessWidenerVersion=1_7_10
builds_for=forge17
embed_joml=false

# Legacy Forge / GTNH
forge_version=10.13.4.1614
mcp_channel=stable
mcp_mappings=12
remote_mappings=https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# GTNH project properties
gtnh.settings.blowdryerTag=
# Skip the dynamic Spotless add: it injects a spotless classpath dep into every
# subproject's buildscript, which only works if buildscript has its own repos block.
gtnh.settings.dynamicSpotlessVersion=false
modName=Distant Horizons
modId=distanthorizons
modGroup=com.seibel.distanthorizons
useModGroupForPublishing=true
autoUpdateBuildScript=false
minecraftVersion=1.7.10
forgeVersion=10.13.4.1614
channel=stable
mappingsVersion=12
remoteMappings=https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName=Developer
enableModernJavaSyntax=jabel
enableGenericInjection=true
generateGradleTokenClass=
gradleTokenVersion=VERSION
replaceGradleTokenInFile=
apiPackage=
accessTransformersFile=distanthorizons_at.cfg
usesMixins=true
separateMixinSourceSet=
usesMixinDebug=false
mixinPlugin=
mixinsPackage=mixin
coreModClass=DistantHorizonsTweaker
containsMixinsAndOrCoreModOnly=false
forceEnableMixins=false
usesShadowedDependencies=true
minimizeShadowedDependencies=false
relocateShadowedDependencies=false
includeWellKnownRepositories=true
excludeWellKnownRepositories=
usesMavenPublishing=false
modrinthProjectId=
modrinthRelations=
curseForgeProjectId=
curseForgeRelations=
disableSpotless=true
disableCheckstyle=true

# GTNH module toggles
# IdeIntegrationModule reads idea.getProject() which returns null on subprojects (the
# IdeaProject only exists on the rootProject), then NPEs in getExt(...).
# Disabled so gtnhconvention can be applied to :forge17 inside the multi-project build.
gtnh.modules.ideIntegration=false
# GitVersionModule would overwrite the version set by the root 'root' script plugin
# during allprojects { version = ... }, breaking version parity across loaders.
gtnh.modules.gitVersion=false

# Netty
netty_version=4.0.23.Final

# LWJGL
lwjgl_version=3.4.0

# Fabric loader
fabric_loader_version=
fabric_api_version=
    # Fabric mod versions
    modmenu_version=
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=
    iris_version=
    bclib_version=
    immersive_portals_version=
    canvas_version=

    fabric_incompatibility_list={}
    fabric_recommend_list={}

    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=0
    enable_starlight=0
    enable_phosphor=0
    enable_lithium=0
    enable_sodium=0
    enable_iris=0
    enable_bclib=0
    enable_immersive_portals=0
    enable_canvas=0

# Forge loader
    # Neo not used but the variable still needs to be defined to make gradle happy
    neoforge_version_range=[*,)

    # Forge mod versions
    terraforged_version=
    oculus_version=

    # Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_starlight_forge=0
    enable_terraforged=0
    enable_terrafirmacraft=0
    enable_oculus=0
