# 1.12.2 version
java_version=8
minecraft_version=1.12.2
parchment_version=
compatible_minecraft_versions=["1.12.2"]
accessWidenerVersion=1_12_2
builds_for=cleanroom
embed_joml=true

# Netty
netty_version=4.1.9.Final

# LWJGL
# base MC/forge use 2.9.4
# cleanroom uses 3.4.1
lwjgl_version=3.4.1

# Cleanroom loader
cleanroom_loader_version=0.5.14-alpha
    # Cleanroom mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_serene_seasons=1
    enable_quark=1
    enable_thermal_dynamics=1

# Fabric loader
fabric_loader_version=
fabric_api_version=
    # Fabric mod versions
    modmenu_version=
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=
    iris_version=
    bclib_version=
    immersive_portals_version=
    canvas_version=
    
    fabric_incompatibility_list={}
    fabric_recommend_list={}
    
    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=0
    enable_starlight=0
    enable_phosphor=0
    enable_lithium=0
    enable_sodium=0
    enable_iris=0
    # not available via github, use curse.maven if necessary
    enable_bclib=0
    enable_immersive_portals=0
    enable_canvas=0

# Forge loader
forge_version=
    # Neo not used but the variable still needs to be defined to make gradle happy
    neoforge_version_range=[*,)
    
    # Forge mod versions
    terraforged_version=
    
    # Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_starlight_forge=0
    enable_terraforged=0
    enable_terrafirmacraft=0
