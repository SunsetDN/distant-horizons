plugins {
    id 'unimined-cleanroom'
}

// Mojang removed ARM LWJGL natives, which causes CI to fail for 1.12.2. Note: this means we cannot build on ARM CPUs right now.
configurations.configureEach {
    incoming.beforeResolve {
        dependencies.withType(ExternalDependency).each { dep ->
            if (dep.group == 'org.lwjgl') {
                dep.artifacts.removeIf {
                    it.classifier?.contains('arm')
                }
            }
        }
    }
}

// ==================== Mod Dependency Helper ====================

def addMod(path, enabled) {
    if (enabled == "2")
        dependencies { modImplementation(path) }
    else if (enabled == "1")
        dependencies { compileOnly(path) }
}


// ==================== Dependencies ====================

dependencies {
    modRuntimeOnly("curse.maven:zume-927564:7983502")
}


// ==================== Tasks ====================

task deleteResources(type: Delete) {
    delete file("build/resources/main")
}

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
    dependsOn(copyCoreResources)
    dependsOn(convertJsonToLang)
    // dependsOn(copyCommonLoaderResources)
}

tasks.named('runClient') {
    dependsOn(copyCoreResources)
    // dependsOn(copyCommonLoaderResources)
    finalizedBy(deleteResources)
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}


